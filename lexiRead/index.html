<p class="font-body-lg text-on-surface-variant">Paste your text below to simplify and enhance readability.</p>
</div>
<!-- Input Area Card -->
<div class="bg-surface-container-lowest rounded-2xl shadow-lg shadow-black/5 w-full flex flex-col p-lg mb-8 border-2 border-primary/50 transition-colors focus-within:border-primary">
<!-- Toolbar -->
<div class="flex items-center justify-between border-b border-surface-variant pb-md mb-md">

    </div>
    <div class="flex gap-1 text-on-surface-variant">
        <button id="uploadBtn" class="px-3 py-2 flex items-center gap-2 hover:bg-surface-container hover:text-primary rounded-lg transition-colors" title="Upload Document">

<span class="material-symbols-outlined text-[20px]">book_2</span>
<span>Instant Dictionary</span>
</button>

<script>
    const textarea = document.querySelector('textarea');
    const toolbar = document.getElementById('selection-toolbar');

    textarea.addEventListener('mouseup', (e) => {
        const selection = window.getSelection().toString().trim();
        
        if (selection.length > 0) {
            // Basic positioning logic based on mouse coordinates for the demo
            // In a real app, you'd use getBoundingClientRect() of the selection if possible,
            // but for textarea, cursor position or mouse event is standard.
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            toolbar.classList.remove('hidden');
            
            // Position above the cursor
            const toolbarWidth = toolbar.offsetWidth;
            toolbar.style.left = `${mouseX - (toolbarWidth / 2)}px`;
            toolbar.style.top = `${mouseY - 60}px`;
        } else {
            toolbar.classList.add('hidden');
        }
    });

    // Hide if clicking elsewhere
    document.addEventListener('mousedown', (e) => {
        if (!toolbar.contains(e.target) && e.target !== textarea) {
            toolbar.classList.add('hidden');
        }
    });
</script>

<script>
    // --- Backend API Integration ---
    const textInput = document.getElementById('textInput');
    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const clearBtn = document.getElementById('clearBtn');
    const recentReadingsSection = document.getElementById('recentReadingsSection');
    const recentReadingsGrid = document.getElementById('recentReadingsGrid');

    // 1. Dynamic Recent Readings Render
    const renderRecentReadings = () => {
        const library = JSON.parse(localStorage.getItem('lexiRead_library') || '[]');
        if (library.length > 0) {
            recentReadingsSection.classList.remove('hidden');
            recentReadingsGrid.innerHTML = library.slice(0, 4).map(item => {
                const displayTitle = item.data?.title || item.title || 'Untitled Reading';
                const bTitle = window.applyBionic ? window.applyBionic(displayTitle) : displayTitle;
                const summary = item.data.simplified_summary || item.data.summary || "";
                const bSummary = window.applyBionic ? window.applyBionic(summary) : summary;
                return `
                <div onclick="openRecent('${item.id}')" class="bg-surface-container-lowest p-md rounded-xl shadow-sm border-2 border-primary/20 hover:border-primary/60 hover:shadow-md transition-all cursor-pointer group">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-label-lg text-on-surface group-hover:text-primary transition-colors">${bTitle}</h3>
                        <span class="text-[10px] uppercase tracking-wider text-on-surface-variant/60 font-bold">${item.date}</span>
                    </div>
                    <p class="font-body-md text-on-surface-variant text-sm line-clamp-2 mb-4 leading-relaxed">
                        ${bSummary}
                    </p>
                    <div class="flex gap-2 items-center text-primary">
                        <span class="material-symbols-outlined text-[18px]">history</span>
                        <span class="text-xs font-label-lg">Open Reading</span>
                    </div>
                </div>
            `;}).join('');
        }
    };

    window.openRecent = (id) => {
        const library = JSON.parse(localStorage.getItem('lexiRead_library') || '[]');
        const item = library.find(i => i.id === id);
        if (item) {
            sessionStorage.setItem('simplifiedData', JSON.stringify(item.data));
            window.location.href = 'reading_view.html';
        }
    };

    // 2. Clear Button
    clearBtn.addEventListener('click', () => {
        textInput.value = '';
        textInput.focus();
    });

    // 4. Initial Load
    document.addEventListener('DOMContentLoaded', () => {
        renderRecentReadings();
    });
    
    // 4b. Upload Document Logic
    const uploadBtn = document.getElementById('uploadBtn');
    uploadBtn.addEventListener('click', () => {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.txt,.md,.csv';
        fileInput.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                textInput.value = event.target.result;
                textInput.focus();
            };
            reader.readAsText(file);
        };
        fileInput.click();
    });

    // 5. Submit Handler
    submitBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Please paste some text first.');
            return;
        }

        loadingOverlay.classList.remove('hidden');
        loadingOverlay.classList.add('flex');

        // Save original text so reading_view can show it
        sessionStorage.setItem('originalText', text);

        try {
            const masterPrompt = localStorage.getItem('lexiRead_masterPrompt');
            const payload = { 
                text: text,
                options: {
                    bionic: localStorage.getItem('lexiRead_bionic') === 'true',
                    ruler: localStorage.getItem('lexiRead_ruler') === 'true'
                }
            };
            if (masterPrompt) payload.custom_prompt = masterPrompt;

            const apiKey = localStorage.getItem('lexiRead_apiKey') || '';
            const response = await fetch('/api/process-text', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-API-Key': apiKey 
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Failed to simplify text');
            const data = await response.json();

            sessionStorage.setItem('simplifiedData', JSON.stringify(data));

            // Save to Library
            try {
                let library = JSON.parse(localStorage.getItem('lexiRead_library') || '[]');
                const summary = data.simplified_summary || data.summary || "";
                
                // Check for duplicates
                const isDuplicate = library.some(item => 
                    (item.data.simplified_summary || item.data.summary) === summary
                );

                if (!isDuplicate) {
                    // Use AI-generated title, fall back to first sentence
                    let title = data.title || '';
                    if (!title) {
                        const match = summary.match(/^(.+?[.!?])\s/);
                        const firstSentence = match ? match[1].trim() : summary.trim();
                        title = firstSentence.length > 60
                            ? firstSentence.substring(0, 57) + '...'
                            : firstSentence || 'Untitled Reading';
                    }

                    const now = new Date();
                    const newReading = {
                        id: Date.now().toString(),
                        date: now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
                        isoDate: now.toISOString(),
                        title: title,
                        data: data
                    };

                    library.unshift(newReading);
                    localStorage.setItem('lexiRead_library', JSON.stringify(library.slice(0, 20)));
                }
            } catch (e) { console.error(e); }

            window.location.href = 'reading_view.html';

        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred: ' + error.message);
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
        }
    });
</script>
